name: Build Galaxy A70Q Kernel

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            flex \
            build-essential \
            libssl-dev \
            libelf-dev \
            libncurses-dev \
            clang \
            llvm \
            lld \
            ccache \
            python3 \
            zip \
            unzip

      - name: Show compiler versions
        run: |
          clang --version
          ld.lld --version
          make --version

      - name: Set build environment
        run: |
          echo "ARCH=arm64" >> "$GITHUB_ENV"
          echo "SUBARCH=arm64" >> "$GITHUB_ENV"

      - name: Find defconfig
        run: |
          echo "Available A70Q/SM6150 defconfigs:"
          find arch/arm64/configs -type f \
            \( -iname "*a70q*" -o -iname "*sm6150*" \) \
            -print

      - name: Build kernel
        run: |
          set -e

          DEFCONFIG=$(find arch/arm64/configs -type f \
            \( -iname "*a70q*" -o -iname "*sm6150*" \) \
            | head -n 1)

          if [ -z "$DEFCONFIG" ]; then
            echo "ERROR: A70Q/SM6150 defconfig not found."
            exit 1
          fi

          DEFCONFIG_NAME=$(basename "$DEFCONFIG")

          echo "Using defconfig: $DEFCONFIG_NAME"

          make "$DEFCONFIG_NAME"

          make -j"$(nproc)" \
            CC=clang \
            LD=ld.lld \
            LLVM=1

      - name: Show build output
        if: always()
        run: |
          echo "Kernel files:"
          find arch/arm64/boot -maxdepth 2 -type f -print || true

      - name: Upload kernel
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: a70q-kernel
          path: |
            arch/arm64/boot/Image
            arch/arm64/boot/Image.gz
            arch/arm64/boot/Image.gz-dtb
            arch/arm64/boot/dts/**/*.dtb
          if-no-files-found: ignore
