name: Build A70Q Cartel Kernel

on:
  workflow_dispatch:

env:
  KERNEL_REPO: https://github.com/YOUR_USERNAME/YOUR_CARTEL_REPO.git
  KERNEL_BRANCH: main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex libssl-dev \
            build-essential git curl ccache \
            libelf-dev libncurses5-dev

      - name: Check kernel version
        run: |
          VERSION=$(make kernelversion)
          echo "Kernel version: $VERSION"

      - name: Verify 4.14.x requirement
        run: |
          VERSION=$(make kernelversion)
          case "$VERSION" in
            4.14.*) echo "Valid 4.14 kernel" ;;
            *) echo "ERROR: Kernel is not 4.14.x"; exit 1 ;;
          esac

      - name: Build
        run: |
          export ARCH=arm64
          export SUBARCH=arm64

          make YOUR_A70Q_DEFCONFIG
          make -j$(nproc)

      - name: Package
        run: |
          mkdir -p out
          cp arch/arm64/boot/Image out/

      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: a70q-cartel-kernel
          path: out/
