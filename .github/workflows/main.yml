name: Build Galaxy A70Q Kernel

on:
  workflow_dispatch:
  push:
    branches:
      - lineage-17.1

jobs:
  build:
    name: Build A70Q Kernel
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            flex \
            build-essential \
            libssl-dev \
            libelf-dev \
            libncurses5-dev \
            libncurses-dev \
            python3 \
            zip \
            unzip \
            cpio \
            rsync \
            git

      - name: Show kernel information
        run: |
          echo "Kernel:"
          grep -E '^VERSION|^PATCHLEVEL|^SUBLEVEL|^EXTRAVERSION' Makefile || true

          echo
          echo "A70Q / SM6150 defconfigs:"
          find arch/arm64/configs \
            -type f \
            \( -iname '*a70q*' -o -iname '*sm6150*' \) \
            -print

      - name: Prepare build directory
        run: |
          mkdir -p out

      - name: Select defconfig
        run: |
          DEFCONFIG=$(find arch/arm64/configs \
            -type f \
            \( -iname '*a70q*' -o -iname '*sm6150*' \) \
            | head -n 1)

          if [ -z "$DEFCONFIG" ]; then
            echo "ERROR: No A70Q/SM6150 defconfig found."
            exit 1
          fi

          DEFCONFIG_NAME=$(basename "$DEFCONFIG")

          echo "DEFCONFIG=$DEFCONFIG_NAME" >> "$GITHUB_ENV"

          echo "Using:"
          echo "$DEFCONFIG_NAME"

      - name: Configure kernel
        run: |
          make O="$PWD/out" \
            ARCH=arm64 \
            "$DEFCONFIG"

      - name: Build kernel
        run: |
          make O="$PWD/out" \
            ARCH=arm64 \
            -j"$(nproc)"

      - name: Show output
        if: always()
        run: |
          echo "===== Kernel output ====="

          find out/arch/arm64/boot \
            -maxdepth 3 \
            -type f \
            -print 2>/dev/null || true

      - name: Upload kernel
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: a70q-kernel
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/Image.gz-dtb
            out/arch/arm64/boot/dts/**/*.dtb
          if-no-files-found: warn
